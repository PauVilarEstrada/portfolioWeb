<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pau Vilar — Full Stack &amp; AI Engineer">
  <defs>
    <linearGradient id="ipBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12171d"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="ipAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25e066"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="ipCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1DB954"/>
    </linearGradient>
    <linearGradient id="ipEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#1DB954" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="ipGlowA" cx="22%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ipGlowB" cx="85%" cy="92%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ipDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.055"/>
    </pattern>
    <clipPath id="ipClip">
      <rect x="12" y="12" width="488" height="488" rx="112"/>
    </clipPath>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#ipBg)"/>
  <g clip-path="url(#ipClip)">
    <rect x="12" y="12" width="488" height="488" fill="url(#ipDots)"/>
    <rect x="12" y="12" width="488" height="488" fill="url(#ipGlowA)"/>
    <rect x="12" y="12" width="488" height="488" fill="url(#ipGlowB)"/>
  </g>
  <rect x="12" y="12" width="488" height="488" rx="112" fill="none" stroke="url(#ipEdge)" stroke-width="3"/>

  <!-- angle brackets -->
  <g fill="none" stroke="url(#ipCyan)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <polyline points="132,196 88,256 132,316"/>
    <polyline points="380,196 424,256 380,316"/>
  </g>

  <!-- P mark -->
  <g fill="#ffffff">
    <rect x="176" y="150" width="30" height="212" rx="10"/>
    <path d="M206 150h74a68 68 0 0 1 0 136h-74v-32h72a36 36 0 0 0 0-72h-72z"/>
  </g>

  <!-- terminal cursor -->
  <rect x="288" y="316" width="46" height="46" rx="12" fill="url(#ipAccent)"/>
</svg>
